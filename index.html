<!doctype html>
<html lang="es">
<head>

  <meta name="description" content="Tizón es un dragón que colecciona curiosidades en lugar de tesoros. Salta rocas, recoge libros y descubre leyendas de dragones de todo el mundo.">

  <main class="stage">
    <div class="frame">
      <canvas id="game" width="960" height="540" aria-label="Tizón el Curioso, un juego de dragón"></canvas>
    </div>
  </main>
  <p class="hint">
    <span><b>ESPACIO</b> salta</span>
    <span><b>ESPACIO en el aire</b> aletea</span>

    <span><b>M</b> silencio</span>
  </p>

</html>
